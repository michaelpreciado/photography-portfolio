<body class="contact-page">

    <a href="#contact" class="skip-to-content">Skip to content</a>
    
    <!-- Mobile menu button moved outside header to prevent overlay issues -->
    <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-nav">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <div id="peace-background" aria-hidden="true"></div> <!-- Container for floating peace signs -->
    <header role="banner">
        <!-- Optimized desktop navigation structure -->
        <div class="header-container">
            <nav class="desktop-nav left-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="portfolio.html">PORTFOLIO</a></li>
                </ul>
            </nav>
            
            <a href="index.html" class="header-logo-link">
                <div class="header-logo-title">
                    <picture>
                        <source srcset="images/optimized/header-320-d83b2721.avif 320w, images/optimized/header-640-d83b2721.avif 640w, images/optimized/header-960-d83b2721.avif 960w" sizes="(max-width: 640px) 50px, 80px" type="image/avif">

                        <img src="images/optimized/header-640-d83b2721.jpeg" srcset="images/optimized/header-320-d83b2721.jpeg 320w, images/optimized/header-640-d83b2721.jpeg 640w, images/optimized/header-960-d83b2721.jpeg 960w" sizes="(max-width: 640px) 50px, 80px" alt="Mario Preciado Photography Logo" class="header-decoration-image" loading="eager" decoding="async" fetchpriority="high">
                    </picture>
                    <h1 class="header-title glow-white">MARIO PRECIADO</h1>
                </div>
            </a>
            
            <nav class="desktop-nav right-nav" aria-label="Secondary navigation">
                <ul>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="contact.html" class="active" aria-current="page">CONTACT</a></li>
                </ul>
            </nav>
        </div>
        
        <!-- Mobile navigation overlay with improved accessibility -->
        <div class="mobile-nav-overlay" id="mobile-nav" aria-hidden="true">
            <nav class="mobile-nav" aria-label="Mobile navigation">
                <ul>
                    <li><a href="index.html">HOME</a></li>

                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contact" class="contact-shell">
          <div class="contact-card reveal">
            <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Let's make a shoot</p>
            <h2>Get in <em>touch</em>.</h2>
            <p class="contact-lede">Tell me the date, the venue, the vibe you're after — I'll get back to you within 24 hours.</p>
            <!-- Vercel serverless contact form -->
            <form id="contact-form" name="contact" method="POST" action="/api/contact">
              <input type="hidden" name="form-name" value="contact">
              <p hidden>
                <label for="bot-field">Do not fill this out:</label>
                <input id="bot-field" name="bot-field" type="text" tabindex="-1" autocomplete="off">
              </p>
              <p>
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" minlength="2" maxlength="100" autocomplete="name" required />
              </p>
              <p>
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" maxlength="254" autocomplete="email" inputmode="email" required />
              </p>
              <p>
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Write your message here..." minlength="10" maxlength="3000" required></textarea>
              </p>
              <p>
                <button type="submit">Send Message</button>
              </p>
              <p id="contact-form-feedback" class="form-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
            </form>
          </div>
        </section>
    </main>

    <footer>
        <!-- Footer content if needed -->
        <div class="social-links">
            <!-- Add actual links -->
            <a href="https://www.instagram.com/mariopreciado.art" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg class="icon icon-instagram" width="45" height="45" aria-hidden="true">
                    <use href="images/icons.svg#icon-instagram"></use>
                </svg>
            </a>
            <a href="mailto:marioopreciadoo@gmail.com" aria-label="Email">
                <svg class="icon icon-envelope" width="45" height="45" aria-hidden="true">
                    <use href="images/icons.svg#icon-envelope"></use>
                </svg>
            </a>
        </div>
        <p class="site-credit">Website designed by <a href="https://michael-preciado.com" target="_blank" rel="noopener noreferrer">MP</a></p>
        <button id="back-to-top" title="Go to top">↑</button>
    </footer>

    <script src="js/contact-form-utils.js" defer></script>
    <script src="js/script.min.js" defer></script>
    <script src="js/sw-register.js" defer></script>

    <!-- Vercel Web Analytics + Speed Insights (same-origin, CSP-safe) -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
